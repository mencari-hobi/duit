app = 'duit'
primary_region = 'sin'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    path = '/healthcheck'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
